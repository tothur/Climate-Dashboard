<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1830" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Climate Dashboard" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/earthicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/earthicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Inter+Tight:wght@600..800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Climate Dashboard</title>
    <meta
      name="description"
      content="Daily global climate indicators in one place: temperature, oceans, ice, greenhouse gases, El Niño, maps and warming projections. Updated every day, in English and Hungarian."
    />
    <link rel="canonical" href="https://tothur.github.io/Climate-Dashboard/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Climate Dashboard" />
    <meta property="og:title" content="Climate Dashboard" />
    <meta
      property="og:description"
      content="Daily global temperature, oceans, ice, greenhouse gases, El Niño, maps and warming projections, updated every day."
    />
    <meta property="og:url" content="https://tothur.github.io/Climate-Dashboard/" />
    <meta property="og:image" content="https://tothur.github.io/Climate-Dashboard/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Climate Dashboard: daily global climate indicators" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="hu_HU" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash light.
      // Mirrors safeTheme/resolveTheme in src/app/App.tsx.
      (function () {
        var mode = null;
        try {
          mode = window.localStorage.getItem("climate-dashboard-theme");
        } catch (error) {}
        var dark =
          mode === "dark" ||
          (mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
